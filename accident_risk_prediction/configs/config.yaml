# =============================================================================
# Rider-centric accident risk prediction from helmet-POV video
# Single source of truth for all hyperparameters.
# =============================================================================

seed: 42

paths:
  raw_videos: data/raw_videos
  video_cache: data/video_cache            # per-video frames / detections / tracks / graphs / ViT
  manifest: data/manifests/sequences.csv   # one row per sequence (written by make_event_sequences)
  runs: runs                               # one folder per training run

# ---------------------------------------------------------------------------
# Frame sampling and sequence length
# ---------------------------------------------------------------------------
frame_extraction:
  frame_rate: 5            # sampled frames per second
  resize: [640, 384]       # (W, H)

sequence:
  length: 12               # frames per sequence (12 @ 5 fps = 2.4 s)

# ---------------------------------------------------------------------------
# Event-based labelling (tools/mark_collisions.py + tools/make_event_sequences.py)
# A window is labelled by its time-to-event (TTE) = event_time - time of the
# window's LAST frame, so the model only sees frames before the decision point.
# Bins are [min, max) in seconds.
# ---------------------------------------------------------------------------
event_labeling:
  events_file: data/annotations/collision_events.json
  # Motorcycle profile: urban speeds are lower, gaps tighter, and a rider can
  # still swerve / lean out of a conflict later than a car can, so the bins
  # are compressed vs. car-based TTC thresholds (car profile was 2 / 4 / 6 / 8).
  bins:
    high:     [0.0, 1.5]   # 3: inside rider reaction time (~1-1.5 s) -> practically unavoidable
    moderate: [1.5, 3.0]   # 2: avoidable only with an immediate brake / swerve
    slight:   [3.0, 4.5]   # 1: conflict developing, normal correction still possible
  safe_min_tte: 6.0        # 0: windows >= 6 s before an event (or with no upcoming event)
                           #    TTE in [4.5, 6) is an ambiguous buffer and is skipped
  post_event_skip:         # seconds skipped after each event, per type (aftermath)
    collision: 5.0         #   crash: fall, tumbling camera, stopped bike
    loss_of_control: 5.0   #   skid / solo fall: same as a crash
    near_miss: 1.0         #   rider keeps riding: what follows can lead up to a NEW event
    default: 5.0           #   any other type
  risk_stride: 2           # stride (sampled frames) inside the pre-event zone (more samples)
  safe_stride: 12          # stride elsewhere (non-overlapping)
  max_safe_per_video: 40   # cap safe windows per video to limit imbalance (null = no cap)
  event_types: [collision, near_miss, loss_of_control]

# ---------------------------------------------------------------------------
# Cross-validation (grouped by video: a ride never spans two folds)
# ---------------------------------------------------------------------------
cv:
  folds: 5                 # train.py --fold k : test = fold k, val = fold k+1, train = rest
split:                     # used only when training without --fold
  train: 0.70
  val: 0.15
  test: 0.15

# ---------------------------------------------------------------------------
# Detector (frozen). To use a fine-tuned Bangladesh detector: point `weights`
# at it, list its class names in `classes`, and set `class_map` to
# {detector_class_id: index_in_classes}. Leave a class out of `class_map` to
# drop it (e.g. an `ego_vehicle` class).
# ---------------------------------------------------------------------------
# Bangladesh detector: YOLO26m trained on ODS_New (17 classes, test mAP50 0.83).
# Report: runs/detector/ods_yolo26m/eval_test/report.md
yolo:
  weights: runs/detector/ods_yolo26m/weights/best.pt
  imgsz: 640
  agnostic_nms: true       # one box per object even if two fine classes compete
  conf_threshold: 0.25
  iou_threshold: 0.45
  device: cuda
  classes: [car, motorcycle, bicycle, pedestrian, bus, truck, rickshaw, cng, easy_bike, slow_vehicle]
  class_map:               # detector class id -> index in `classes`
    0: 2    # Bicycle -> bicycle
    1: 4    # Bus -> bus
    2: 9    # Bhotbhoti -> slow_vehicle
    3: 0    # Car -> car
    4: 7    # CNG -> cng
    5: 8    # Easybike -> easy_bike
    6: 4    # Leguna -> bus
    7: 1    # Motorbike -> motorcycle
    8: 0    # MPV -> car
    9: 3    # Pedestrian -> pedestrian
    10: 5   # Pickup -> truck
    11: 9   # PowerTiller -> slow_vehicle
    12: 6   # Rickshaw -> rickshaw
    13: 6   # ShoppingVan -> rickshaw
    14: 5   # Truck -> truck
    15: 5   # Van -> truck
    16: 9   # Wheelbarrow -> slow_vehicle

# Previous COCO detector (to switch back, replace the yolo block above with this):
# yolo:
#   weights: weights/yolo26x.pt
#   conf_threshold: 0.25
#   iou_threshold: 0.45
#   device: cuda
#   classes: [car, motorcycle, bicycle, pedestrian, bus, truck]
#   class_map: {2: 0, 3: 1, 1: 2, 0: 3, 5: 4, 7: 5}   # COCO id -> index

# The rider's own handlebars / tank / arms get detected as "motorcycle" or
# "person". Drop boxes of these classes that touch the bottom edge and are wide.
ego_filter:
  enabled: true
  classes: [1, 2, 3]       # motorcycle, bicycle, pedestrian
  min_bottom: 0.95         # box bottom >= this fraction of image height
  min_width: 0.25          # box width  >= this fraction of image width

# Where the rider is in the image (normalised cx, cy, w, h). Used as the ego
# node of the graph and as the reference point for distance / bearing.
ego_box: [0.5, 0.85, 0.5, 0.3]

tracking:                  # ByteTrack, run once over the whole video
  fps_multiplier: 3        # detect + track at 3 x frame_rate (15 fps) so fast objects still match
  track_thresh: 0.3
  match_thresh: 0.8
  track_buffer: 5          # sampled frames a lost track is kept alive (1 s)
  min_track_length: 3      # in dense (15 fps) frames
  frame_rate: 5

# ---------------------------------------------------------------------------
# Graph features
#   node: [cx, cy, w, h, vx, vy, acc, dist_to_rider, bearing_sin, bearing_cos,
#          looming (1/tau), tau, is_ego, one-hot class...]
#   edge: [proximity, rel_velocity_long, rel_velocity_lat, ttc]
# Velocities are head-motion compensated and log-scaled (no hard saturation).
# ---------------------------------------------------------------------------
features:
  velocity_scale: 20.0     # px/s that maps to symlog(1)
  accel_scale: 50.0        # px/s^2
  loom_clamp: 3.0          # 1/s  (box-height growth rate)
  tau_clamp: 6.0           # s    (looming time-to-contact cap)
  ttc_clamp: 10.0          # s    (pairwise geometric TTC cap)
  compensate_head_motion: true

graph:
  k_neighbors: 4
  include_ego_node: true

cache:
  flip_aug: true           # also cache ViT embeddings of mirrored frames (train augmentation)
  vit_batch: 32

vit:
  model_name: google/vit-base-patch16-224-in21k
  image_size: 224
  output_dim: 768

ego_motion:
  dim: 6                   # [tx, ty, rotation, log-scale, flow magnitude, inlier ratio]

# ---------------------------------------------------------------------------
# Model (about 1-2 M trainable parameters; ViT is frozen and pre-computed)
# ---------------------------------------------------------------------------
model:
  d_model: 128
  dropout: 0.2
  gnn:
    hidden_dim: 64
    num_heads: 4
    num_layers: 2
  temporal:
    num_heads: 4
    num_layers: 2
    dim_feedforward: 256
  fusion:
    num_heads: 4
    num_layers: 1

heads:
  num_classes: 4           # 0=safe, 1=slight, 2=moderate, 3=high
  type: ordinal            # ordinal (labels are ordered TTE bins) | softmax

loss:
  lambda_ttc: 0.5
  class_weights: auto      # auto = inverse frequency from the training split | null | [w0, w1, w2, w3]

training:
  epochs: 60
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.01
  num_workers: 0
  grad_clip: 1.0
  early_stop_patience: 12
  select_metric: f1        # checkpoint selection on validation: f1 (macro) | loss
  flip_prob: 0.5
  device: cuda

evaluation:
  alarm_class: 1           # alarm score = P(risk >= this class)
  alarm_threshold: 0.5

# ---------------------------------------------------------------------------
# Non-learned baseline: looming time-to-contact rule (tools/run_baselines.py,
# features/looming_rule.py). Thresholds come from event_labeling.bins
# (tau_fixed) or are fitted on the training folds (tau_tuned).
# ---------------------------------------------------------------------------
baselines:
  looming:
    front_cos: 0.5         # only objects within +-60 deg of straight ahead of the rider
    min_height: 0.04       # ignore boxes shorter than this fraction of image height (noisy looming)
    persist: 2             # the low tau must hold for this many frames (0.4 s)
    softness: 0.5          # s, only shapes the scores used for AUC / AP

# ---------------------------------------------------------------------------
# Ablation switches
# ---------------------------------------------------------------------------
ablation:
  use_vit: true
  use_gnn: true
  use_temporal: true
  use_ego: true
